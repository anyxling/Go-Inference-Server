events {}

http {
    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate     C:/Users/lxl/OneDrive/Documents/GitHub/Go-Inference-Server/deploy/certs/cert.pem;
        ssl_certificate_key C:/Users/lxl/OneDrive/Documents/GitHub/Go-Inference-Server/deploy/certs/key.pem;
        access_log logs/access.log main;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_buffering off;              # send each upstream chunk to the client immediately
            proxy_http_version 1.1;           # required for chunked streaming to work properly upstream
            proxy_set_header Connection "";   # lets Nginx keep upstream connections alive
            proxy_read_timeout 150s;          # must exceed the Go -total-timeout (2m), or Nginx cuts long streams
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 1m;
            limit_req zone=perip burst=40 nodelay;
            limit_req_status 429;
            error_page 429 = @rate_limited;
            error_page 413 = @too_large;
        }
        location @rate_limited {
            add_header Retry-After 1 always;
            add_header Content-Type application/json always;
            return 429 '{"code":"too_many_requests","message":"rate limit exceeded"}';
        }

        location @too_large {
            add_header Content-Type application/json always;
            return 413 '{"code":"request_too_large","message":"request body exceeds 1 MB"}';
        }
    }
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    log_format main '$remote_addr $request $status $upstream_http_x_request_id $request_time';
}
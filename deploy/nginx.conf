events {}

http {
    server {
        listen 80;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_buffering off;              # send each upstream chunk to the client immediately
            proxy_http_version 1.1;           # required for chunked streaming to work properly upstream
            proxy_set_header Connection "";   # lets Nginx keep upstream connections alive
            proxy_read_timeout 150s;          # must exceed the Go -total-timeout (2m), or Nginx cuts long streams
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 1m;
            limit_req zone=perip burst=40 nodelay;
            limit_req_status 429;
        }
    }
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
}
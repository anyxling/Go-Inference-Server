events {}

http {
    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate     C:/Users/lxl/OneDrive/Documents/GitHub/Go-Inference-Server/deploy/certs/cert.pem;
        ssl_certificate_key C:/Users/lxl/OneDrive/Documents/GitHub/Go-Inference-Server/deploy/certs/key.pem;
        access_log logs/access.log main;

        # Shared proxy settings: inherited by every location below.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;

        # Inference: streamed, long-lived, limited per client.
        location /v1/inference {
            proxy_pass http://127.0.0.1:8080;
            proxy_buffering off;
            proxy_read_timeout 150s;
            client_max_body_size 1m;
            limit_req zone=perip burst=40 nodelay;   # raise or comment out for load tests
            limit_req_status 429;
            error_page 429 = @rate_limited;
            error_page 413 = @too_large;
        }

        # Everything else (/health): never capacity-limited.
        location / {
            proxy_pass http://127.0.0.1:8080;
        }

        location @rate_limited {
            add_header Retry-After 1 always;
            add_header Content-Type application/json always;
            return 429 '{"code":"too_many_requests","message":"rate limit exceeded"}';
        }

        location @too_large {
            add_header Content-Type application/json always;
            return 413 '{"code":"request_too_large","message":"request body exceeds 1 MB"}';
        }
    }
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    log_format main '$remote_addr $request $status $upstream_http_x_request_id $request_time';
}